{% extends "orchestrator/base.html" %}
{% load orchestrator_extras %}
{% block content %}
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-2">{{ title }}</h4>
      <form method="post" class="mt-3" autocomplete="off">
        {% csrf_token %}
        {{ form.non_field_errors }}

        <div class="row g-3">
          {% for field in form %}
            <div class="col-md-6">
              <label class="form-label">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
              {{ field|add_class:"form-control" }}
              {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
            </div>
          {% endfor %}
        </div>

        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-primary" type="submit">Update Password</button>
          <a class="btn btn-outline-secondary" href="{% url 'orchestrator:user_list' %}">Back</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
