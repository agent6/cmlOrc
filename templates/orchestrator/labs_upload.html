{% extends "orchestrator/base.html" %}
{% block content %}
  <h2>Upload Lab YAML to All Servers</h2>
  <p class="text-muted">Select an exported CML lab YAML. The file is sent to every configured server using its credentials.</p>
  <form method="post" enctype="multipart/form-data" class="mt-3">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-3">
      <label class="form-label">YAML File</label>
      {{ form.yaml_file }}
    </div>
    <button class="btn btn-primary" type="submit">Upload to All</button>
    <a class="btn btn-secondary" href="{% url 'orchestrator:home' %}">Cancel</a>
  </form>
{% endblock %}
