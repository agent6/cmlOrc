{% extends "orchestrator/base.html" %}
{% block content %}
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-3">Delete User</h4>
      <p>Are you sure you want to delete user <strong>{{ user_obj.username }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Delete</button>
        <a class="btn btn-outline-secondary" href="{% url 'orchestrator:user_list' %}">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
